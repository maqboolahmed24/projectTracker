name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: "3400"
      APP_ORIGIN: http://localhost:3400
      DATABASE_URL: postgres://ukda_app_dev:ukda_app_local_only@127.0.0.1:55432/ukda_app
      CONTROL_DATABASE_URL: postgres://ukda_control_dev:ukda_control_local_only@127.0.0.1:55433/ukda_control
      COMPOSE_PROJECT_NAME: ukda-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start isolated application and control databases
        run: docker compose up --detach --wait app-db control-db
      - name: Build
        run: npm run build
      - name: Apply application and security migrations
        env:
          ADMIN_DATABASE_URL: postgres://ukda_app_admin:ukda_app_admin_local_only@127.0.0.1:55432/ukda_app
          CONTROL_ADMIN_DATABASE_URL: postgres://ukda_control_admin:ukda_control_admin_local_only@127.0.0.1:55433/ukda_control
        run: npm run migrate
      - name: Bootstrap hosted worker schema
        env:
          ADMIN_DATABASE_URL: postgres://ukda_app_admin:ukda_app_admin_local_only@127.0.0.1:55432/ukda_app
          CONTROL_ADMIN_DATABASE_URL: postgres://ukda_control_admin:ukda_control_admin_local_only@127.0.0.1:55433/ukda_control
        run: npm run worker:migrate
      - name: Check
        run: npm run check
      - name: Test
        env:
          MIGRATION_TEST_ADMIN_DATABASE_URL: postgres://ukda_app_admin:ukda_app_admin_local_only@127.0.0.1:55432/ukda_app
          PERSISTENCE_TEST_CONTROL_ADMIN_DATABASE_URL: postgres://ukda_control_admin:ukda_control_admin_local_only@127.0.0.1:55433/ukda_control
        run: npm test
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --no-color app-db control-db
      - name: Remove disposable CI databases
        if: always()
        run: docker compose down --volumes --remove-orphans
