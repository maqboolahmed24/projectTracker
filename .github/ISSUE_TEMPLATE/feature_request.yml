name: Feature request
description: Suggest an improvement to Maqbool.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the user need without sharing private workspace data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Explain how the change would help, including alternatives you considered.
    validations:
      required: true
