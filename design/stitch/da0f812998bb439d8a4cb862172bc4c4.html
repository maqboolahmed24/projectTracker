<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign in to Northstar Studio - UKDA</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

    tailwind.config = {
      darkMode: "class",

            "on-background": "#2c3433",
            "tertiary-dim": "#4b5738",

            "inverse-on-surface": "#9b9d9d",
            "tertiary-fixed-dim": "#ddebc2",
            "secondary-fixed": "#dbe5e0",
            "on-primary-container": "#005e44",
            "surface-variant": "#dce4e3",
            "on-primary-fixed-variant": "#12684d",

            "surface-container-highest": "#dce4e3",
            "background": "#f9f9f8",

            "secondary-dim": "#4c5551",
            "error-dim": "#4e0309",
            "on-primary": "#e0ffee",
            "on-error-container": "#752121",
            "surface-container-lowest": "#ffffff",
            "on-secondary-container": "#4b5450",
            "on-secondary": "#f2fbf6",
            "surface-container-high": "#e3e9e8",
            "on-tertiary-fixed-variant": "#5e6a4a",
            "tertiary": "#576343",
            "error": "#9f403d",
            "on-secondary-fixed": "#39413e",
            "surface-bright": "#f9f9f8",
            "secondary": "#58615d",
            "on-tertiary-container": "#546040",
            "surface-dim": "#d2dcdb",
            "primary-fixed-dim": "#96e4c2",
            "on-secondary-fixed-variant": "#555d5a",
            "on-surface-variant": "#586160",
            "surface-container": "#eaefee",
            "error-container": "#fe8983"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "gutter": "1rem",
            "space-lg": "1.5rem",
            "margin": "2rem",
            "space-md": "1rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-xl": "2rem"
          },
          "fontFamily": {
            "headline-sm": ["Inter"],

          },
          "fontSize": {

            "body-md": ["0.875rem", { "lineHeight": "1.375rem", "fontWeight": "400" }],
            "label-sm": ["0.75rem", { "lineHeight": "0.875rem", "fontWeight": "500" }],
            "headline-lg": ["1.75rem", { "lineHeight": "2.25rem", "fontWeight": "600" }],
            "label-md": ["0.8125rem", { "lineHeight": "1rem", "fontWeight": "500" }],
            "body-sm": ["0.8125rem", { "lineHeight": "1.25rem", "fontWeight": "400" }],
            "headline-md": ["1.375rem", { "lineHeight": "1.875rem", "fontWeight": "600" }],
            "body-lg": ["1rem", { "lineHeight": "1.5rem", "fontWeight": "400" }]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
      font-size: 1.125rem;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container">
<!-- Minimal Desktop Top Bar -->
<header class="h-16 w-full px-8 flex items-center justify-between z-10">
<div class="flex items-center gap-3">
<!-- UKDA Triangular Capsule Mark -->
<div aria-label="UKDA Brandmark" class="flex items-center gap-1.5">
<span class="w-1.5 h-5 rounded-full bg-primary transform -rotate-12 transition-transform"></span>
<span class="w-1.5 h-5 rounded-full bg-primary-container transform rotate-6"></span>
<span class="w-1.5 h-3.5 rounded-full bg-tertiary-fixed transform -rotate-6"></span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight ml-1">UKDA</span>
</div>
<!-- Theme / Status Quiet Anchor -->
<div class="flex items-center gap-4">
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container-low border border-outline-variant/30 text-on-surface-variant">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="font-label-sm text-label-sm">Local vault online</span>
</div>
<button aria-label="Dark mode toggle" class="w-8 h-8 rounded-lg flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container-low transition-colors duration-150" type="button">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
</div>
</header>
<!-- Main Viewport Canvas (Centered Authentication Card) -->
<main class="flex-1 flex flex-col items-center justify-center px-4 py-8">
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl border border-outline-variant/30 p-8 shadow-[0_8px_24px_rgba(0,0,0,0.03)] transition-all duration-200">
<!-- Profile Header Cluster -->
<div class="flex flex-col items-center text-center mb-6">
<!-- Alex Morgan Creature Avatar Badge -->
<div class="relative mb-4">
<div class="w-16 h-16 rounded-full bg-surface-container-low border-2 border-surface-container-lowest ring-1 ring-outline-variant/40 flex items-center justify-center overflow-hidden">
<svg aria-label="Alex Morgan avatar badge" class="w-12 h-12 text-primary" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<circle cx="24" cy="24" fill="#EBF9D0" fill-opacity="0.6" r="22"></circle>
<!-- Geometric creature playful motif -->
<rect fill="#176B50" height="14" rx="4" width="18" x="15" y="18"></rect>
<circle cx="19" cy="23" fill="#FFFFFF" r="2"></circle>
<circle cx="29" cy="23" fill="#FFFFFF" r="2"></circle>
<path d="M22 28C22.6 28.8 23.2 29 24 29C24.8 29 25.4 28.8 26 28" stroke="#FFFFFF" stroke-linecap="round" stroke-width="1.5"></path>
<polygon fill="#A4F3D0" points="17,14 20,18 14,18"></polygon>
<polygon fill="#A4F3D0" points="31,14 34,18 28,18"></polygon>
</svg>
</div>
<!-- Verified Node Pill -->
<div class="absolute -bottom-1 -right-1 bg-surface-container-lowest p-0.5 rounded-full ring-1 ring-outline-variant/30">
<span class="material-symbols-outlined text-primary text-[14px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-1.5">
          Welcome back, Alex.
        </h1>
<!-- Workspace badge -->
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-surface-container-low text-secondary border border-outline-variant/20">
<span class="material-symbols-outlined text-primary" data-icon="folder">folder</span>
<span class="font-label-md text-label-md">Northstar Studio · On-device vault</span>
</div>
</div>
<!-- Authentication Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="master-password">
              Master password
            </label>
<span class="font-label-sm text-label-sm text-secondary">Required</span>
</div>
<!-- Password Input Group with Inline Toggle -->
<div class="relative">
<input autocomplete="current-password" class="w-full h-11 px-3.5 pr-10 rounded-lg border border-outline-variant/40 bg-surface-container-lowest text-on-surface placeholder:text-outline-variant text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-150" id="master-password" name="password" placeholder="••••••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-on-surface focus:outline-none transition-colors duration-150" id="toggle-visibility" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
<!-- Subtle security hint -->
<div class="flex items-center gap-1.5 pt-1 text-on-surface-variant">
<span class="material-symbols-outlined text-[14px] text-primary" data-icon="lock">lock</span>
<p class="font-body-sm text-body-sm">Derived locally with Argon2id</p>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-11 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary-dim active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2 mt-2 cursor-pointer shadow-sm" type="submit">
<span>Sign in to workspace</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary Navigation Hierarchy -->
<div class="mt-6 pt-5 border-t border-outline-variant/20 flex flex-col items-center gap-3">
<a class="font-label-md text-label-md text-primary hover:text-primary-dim transition-colors duration-150" href="#recover">
          Forgot password?
        </a>
<div class="flex items-center gap-3 text-outline-variant font-body-sm text-body-sm">
<a class="text-secondary hover:text-on-surface transition-colors duration-150" href="#switch-profile">
            Switch profile
          </a>
<span class="text-outline-variant/60">•</span>
<a class="text-secondary hover:text-on-surface transition-colors duration-150" href="#licence">
            Use a different licence
          </a>
</div>
</div>
</div>
</main>
<!-- Discreet Viewport Footer -->
<footer class="h-14 w-full px-8 flex items-center justify-center">
<p class="font-body-sm text-body-sm text-secondary tracking-tight">
      Private by design. Built for working together.
    </p>
</footer>
<script>
    // Micro-interaction: Password visibility toggle
    const toggleBtn = document.getElementById('toggle-visibility');
    const pwdInput = document.getElementById('master-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
</body></html>
