<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Maqbool · Launch motion</title>
    <link rel="icon" href="assets/ukds-symbol.svg" type="image/svg+xml">
    <link rel="stylesheet" href="preview.css">
    <link rel="preload" href="ukda-launch.css" as="style">
  </head>
  <body>
    <main class="preview" data-theme="light">
      <div class="preview-stage" aria-label="Maqbool equal-bar symbol animation">
        <div id="mark" role="img" aria-label="Maqbool equal-bar symbol"></div>
      </div>
      <nav class="preview-controls" aria-label="Animation preview controls">
        <button id="replay" type="button">Replay</button>
        <button id="launch" type="button">Preview app launch</button>
        <span class="separator" aria-hidden="true"></span>
        <button id="theme" type="button" aria-pressed="false">Dark background</button>
      </nav>
    </main>
    <script type="module" src="preview.js"></script>
  </body>
</html>
